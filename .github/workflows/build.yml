name: Build

on:
  push:
  workflow_dispatch:

jobs:
  tipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ldid
      - name: Build TrollStore package
        run: ./scripts/build-tipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DeviceHealth-tipa
          path: build/DeviceHealth.tipa
